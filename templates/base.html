<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}E-Learning PoC{% endblock %}</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#1a1a1a;background:#fafafa}
    header{padding:12px 16px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
    header a{color:#2563eb;text-decoration:none;margin-left:12px}
    main{max-width:900px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin-bottom:16px}
    .card a{color:#2563eb;text-decoration:none}
    .btn{padding:8px 14px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
    .btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
  </style>
</head>
<body>
<header>
  <a href="{% url 'course-list' %}"><strong>E-Learning PoC</strong></a>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'vault-list' %}">Vault</a>
      <a href="{% url 'vault-download' %}" class="btn" style="margin-left:8px">Download .zip</a>
      <span style="margin-left:12px">{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit" class="btn" style="margin-left:8px">Logout</button></form>
    {% else %}
      <a href="{% url 'login' %}">Login</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
