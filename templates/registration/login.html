{% extends "base.html" %}
{% block title %}Login — E-Learning PoC{% endblock %}
{% block content %}
<h1>Login</h1>
{% if form.errors %}<p style="color:#dc2626">Username atau password salah.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Login</button>
  <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
